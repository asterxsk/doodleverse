[workspace]
resolver = "3"
members = [
    "crates/doodle-types",
    "crates/doodle-canvas",
    "crates/doodle-document",
    "crates/doodle-render",
    "crates/doodle-files",
    "crates/doodle-ai",
    "crates/doodle-platform",
    "crates/doodle-app",
    "crates/doodle-app-rune",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Doodleverse contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/asterxsk/doodleverse"

[workspace.dependencies]
doodle-types = { path = "crates/doodle-types" }
doodle-canvas = { path = "crates/doodle-canvas" }
doodle-document = { path = "crates/doodle-document" }
doodle-render = { path = "crates/doodle-render" }
doodle-files = { path = "crates/doodle-files" }
doodle-ai = { path = "crates/doodle-ai" }
doodle-platform = { path = "crates/doodle-platform" }

serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
thiserror = "2.0.21"
postcard = { version = "1.1.3", features = ["use-std"] }
crc32fast = "1.5.5"
yrs = "0.28.1"
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.18.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
serde_json = "1.0.145"
log = "0.4.28"
env_logger = "0.11.8"
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", default-features = false }
rune = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }

# Rune's patched renderer/text/accessibility crates. Cargo does not inherit a dependency's
# [patch.crates-io]; every app that builds Rune must repeat these at the same revision.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "958743308f36fdf1c568c513badc96ddb0c7f040" }

[profile.dev]
opt-level = 1
debug = 1
